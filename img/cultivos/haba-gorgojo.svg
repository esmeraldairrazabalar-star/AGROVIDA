<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs><linearGradient id="bg_bru" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#EFEBE9"/><stop offset="100%" stop-color="#D7CCC8"/></linearGradient></defs>
  <rect width="400" height="280" rx="14" fill="url(#bg_bru)"/>
  <!-- Grano de haba grande aplanado verde-amarillento -->
  <path d="M120 150 C110 90 170 60 250 70 C330 80 340 160 310 210 C270 250 170 250 130 220 C110 200 125 180 120 150 Z" fill="#DCE775" stroke="#9E9D24" stroke-width="3.5"/>
  <path d="M130 140 Q138 160 132 180" stroke="#827717" stroke-width="4" stroke-linecap="round" fill="none"/><!-- Hilio del haba -->
