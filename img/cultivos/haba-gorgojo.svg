  <circle cx="250" cy="140" r="22" fill="#212121" stroke="#5D4037" stroke-width="3"/>
  <circle cx="280" cy="180" r="16" fill="#3E2723"/>
  <!-- Gorgojo adulto al costado -->
  <g transform="translate(60, 45) scale(0.65)">
    <ellipse cx="60" cy="65" rx="26" ry="32" fill="#4E342E" stroke="#212121" stroke-width="2"/>
    <ellipse cx="60" cy="28" rx="15" ry="12" fill="#3E2723"/>
    <path d="M40 50 Q15 40 10 60" stroke="#212121" stroke-width="4" fill="none"/>
    <path d="M80 50 Q105 40 110 60" stroke="#212121" stroke-width="4" fill="none"/>
  </g>
  <rect x="18" y="16" width="225" height="34" rx="8" fill="#4E342E" opacity="0.94"/>
  <text x="28" y="38" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Gorgojo del haba (Bruchus)</text>
</svg>