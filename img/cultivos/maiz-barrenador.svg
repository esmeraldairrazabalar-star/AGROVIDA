<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280">
  <defs><linearGradient id="bg_dia" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F5F5F5"/><stop offset="100%" stop-color="#EEEEEE"/></linearGradient></defs>
  <rect width="400" height="280" rx="14" fill="url(#bg_dia)"/>
  <!-- Tallo grueso de maíz en sección longitudinal -->
  <rect x="150" y="30" width="100" height="230" rx="12" fill="#E8F5E9" stroke="#558B2F" stroke-width="4"/>
  <line x1="150" y1="120" x2="250" y2="120" stroke="#33691E" stroke-width="6"/><!-- Nudo -->
  <line x1="150" y1="210" x2="250" y2="210" stroke="#33691E" stroke-width="6"/><!-- Nudo inferior -->
  <!-- Galería interna barrenada -->
  <path d="M190 70 Q215 110 205 160 Q195 200 210 240" stroke="#5D4037" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- Orificio de salida con aserrín -->
  <circle cx="150" cy="145" r="10" fill="#212121"/>
  <ellipse cx="140" cy="155" rx="16" ry="8" fill="#795548" opacity="0.8"/>
  <!-- Larva barrenadora crema con manchas oscuras -->
  <path d="M198 120 Q208 140 204 165" stroke="#FFF9C4" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="204" cy="168" r="4" fill="#3E2723"/>
  <circle cx="200" cy="130" r="1.5" fill="#3E2723"/><circle cx="204" cy="145" r="1.5" fill="#3E2723"/>
  <rect x="18" y="16" width="245" height="34" rx="8" fill="#5D4037" opacity="0.94"/>
  <text x="28" y="38" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Barrenador del tallo (Diatraea)</text>
</svg>